<svg xmlns="http://www.w3.org/2000/svg" viewBox="16 36 848.8000000000001 420.5" width="848.8000000000001" height="420.5"><defs><marker id="head-1e1e1e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e1e1e"/></marker><marker id="head-c92a2a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c92a2a"/></marker></defs><rect x="16" y="36" width="848.8000000000001" height="420.5" rx="10" fill="#ffffff"/><rect x="40" y="60" width="260" height="150" rx="0" stroke="#1e1e1e" stroke-width="2" fill="#fff3bf" opacity="1"/><text x="170" y="114" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle"><tspan x="170" dy="0">Repository (git, synced)</tspan><tspan x="170" dy="17.5">openspec/ board files</tspan><tspan x="170" dy="17.5">attachments/plans</tspan><tspan x="170" dy="17.5">config.yaml: storage, filesDir</tspan></text><ellipse cx="170" cy="315" rx="130" ry="55" stroke="#1e1e1e" stroke-width="2" fill="#d0ebff" opacity="1"/><text x="170" y="311.5" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle"><tspan x="170" dy="0">Connected storage</tspan><tspan x="170" dy="17.5">board + attachments/images</tspan></text><rect x="460" y="60" width="300" height="190" rx="0" stroke="#1e1e1e" stroke-width="2" fill="#e9ecef" opacity="1"/><text x="610" y="125.25" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle"><tspan x="610" dy="0">This computer, this user</tspan><tspan x="610" dy="17.5">settings.json</tspan><tspan x="610" dy="17.5">per project: view, groups, sort,</tspan><tspan x="610" dy="17.5">hidden columns/rows/projects,</tspan><tspan x="610" dy="17.5">column order and widths</tspan></text><rect x="460" y="300" width="300" height="70" rx="0" stroke="#1e1e1e" stroke-width="2" fill="#ffffff" opacity="1"/><text x="610" y="332" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#1e1e1e" text-anchor="middle"><tspan x="610" dy="0">%APPDATA%\RepoTaskManager\settings-location.txt</tspan><tspan x="610" dy="15">(fixed; names the chosen folder)</tspan></text><polyline points="610,300 610,250" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linejoin="round" marker-end="url(#head-1e1e1e)"/><rect x="559.8" y="265.5" width="100.4" height="19" fill="#ffffff"/><text x="610" y="279.5" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#1e1e1e" text-anchor="middle"><tspan x="610" dy="0">found at start</tspan></text><polyline points="300,135 460,135" fill="none" stroke="#c92a2a" stroke-width="2" stroke-linejoin="round" marker-end="url(#head-c92a2a)"/><rect x="333.1" y="125.5" width="93.80000000000001" height="19" fill="#ffffff"/><text x="380" y="139.5" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#1e1e1e" text-anchor="middle"><tspan x="380" dy="0">never crosses</tspan></text><polyline points="170,210 170,260" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linejoin="round" marker-end="url(#head-1e1e1e)"/><rect x="152.8" y="225.5" width="34.400000000000006" height="19" fill="#ffffff"/><text x="170" y="239.5" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#1e1e1e" text-anchor="middle"><tspan x="170" dy="0">sync</tspan></text><text x="40" y="413" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e1e1e"><tspan x="40" dy="0">A new build or reinstall reads the pointer, then the settings: nothing is lost with the app folder.</tspan><tspan x="40" dy="16.25">The repository and the storage hold what every computer shares; settings.json holds what only this one arranges.</tspan></text></svg>
