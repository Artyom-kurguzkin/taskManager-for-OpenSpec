<svg xmlns="http://www.w3.org/2000/svg" viewBox="226 -4 783.2 688" width="783.2" height="688"><defs><marker id="head-1e1e1e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e1e1e"/></marker></defs><rect x="226" y="-4" width="783.2" height="688" rx="10" fill="#ffffff"/><rect x="260" y="20" width="320" height="80" rx="10" stroke="#1e1e1e" stroke-width="2" fill="#a5d8ff" opacity="1"/><text x="420" y="56" font-family="Segoe UI, system-ui, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="420" dy="0">A board file changed outside the app</tspan><tspan x="420" dy="20">(git pull, checkout, hand edit)</tspan></text><polyline points="420,100 420,150" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linejoin="round" marker-end="url(#head-1e1e1e)"/><polygon points="420,150 570,220 420,290 270,220" stroke="#1e1e1e" stroke-width="2" fill="#fff3bf" opacity="1"/><text x="420" y="216" font-family="Segoe UI, system-ui, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="420" dy="0">Git merge or rebase</tspan><tspan x="420" dy="20">in progress?</tspan></text><polyline points="570,220 700,220" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linejoin="round" marker-end="url(#head-1e1e1e)"/><rect x="619.45" y="209.25" width="31.1" height="21.5" fill="#ffffff"/><text x="635" y="225.25" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle"><tspan x="635" dy="0">yes</tspan></text><rect x="700" y="175" width="280" height="90" rx="10" stroke="#1e1e1e" stroke-width="2" fill="#ffd8a8" opacity="1"/><text x="840" y="216" font-family="Segoe UI, system-ui, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="840" dy="0">Sync paused</tspan><tspan x="840" dy="20">until the merge is finished</tspan></text><polyline points="420,290 420,350" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linejoin=