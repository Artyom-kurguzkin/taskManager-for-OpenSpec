<svg xmlns="http://www.w3.org/2000/svg" viewBox="-8 -4 932 453" width="932" height="453"><defs></defs><rect x="-8" y="-4" width="932" height="453" rx="10" fill="#ffffff"/><text x="40" y="42" font-family="Segoe UI, system-ui, sans-serif" font-size="22" fill="#1e1e1e"><tspan x="40" dy="0">#235: what a click does on a card, row or calendar bar</tspan></text><text x="40" y="88" font-family="Segoe UI, system-ui, sans-serif" font-size="18" fill="#c92a2a"><tspan x="40" dy="0">BEFORE</tspan></text><rect x="40" y="105" width="260" height="70" rx="10" stroke="#1e1e1e" stroke-width="1" fill="#e9ecef" opacity="1"/><text x="170" y="136.5" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle"><tspan x="170" dy="0">click -&gt; opens the item</tspan><tspan x="170" dy="17.5">(selection untouched)</tspan></text><rect x="340" y="105" width="260" height="70" rx="10" stroke="#1e1e1e" stroke-width="1" fill="#e9ecef" opacity="1"/><text x="470" y="136.5" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle"><tspan x="470" dy="0">shift-click -&gt; toggles selection</tspan><tspan x="470" dy="17.5">(the only way to select)</tspan></text><text x="40" y="238" font-family="Segoe UI, system-ui, sans-serif" font-size="18" fill="#2b8a3e"><tspan x="40" dy="0">AFTER</tspan></text><rect x="40" y="255" width="260" height="80" rx="10" stroke="#1e1e1e" stroke-width="1" fill="#fff3bf" opacity="1"/><text x="170" y="291.5" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle"><tspan x="170" dy="0">click -&gt; this item alone is selected</tspan><tspan x="170" dy="17.5">(previous selection let go)</tspan></text><rect x="340" y="255" width="260" height="80" rx="10" stroke="#1e1e1e" stroke-width="1" fill="#fff3bf" opacity="1"/><text x="470" y="291.5" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle"><tspan x="470" dy="0">shift / ctrl-click -&gt; adds or removes</tspan><tspan x="470" dy="17.5">(two or more selected)</tspan></text><rect x="640" y="255" width="260" height="80" rx="10" stroke="#1e1e1e" stroke-width="1" fill="#d3f9d8" opacity="1"/><text x="770" y="291.5" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle"><tspan x="770" dy="0">click the selected item, or</tspan><tspan x="770" dy="17.5">double-click -&gt; opens its details</tspan></text><rect x="40" y="365" width="260" height="60" rx="10" stroke="#1e1e1e" stroke-width="1" fill="#e9ecef" opacity="1"/><text x="170" y="400.25" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle"><tspan x="170" dy="0">click on empty space -&gt; nothing selected</tspan></text><text x="340" y="395" font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#1e1e1e"><tspan x="340" dy="0">Same in the board, the list and the calendar (bars and rows).</tspan></text></svg>
