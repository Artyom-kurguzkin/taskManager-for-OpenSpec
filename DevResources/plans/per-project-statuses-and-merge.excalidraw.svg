<svg xmlns="http://www.w3.org/2000/svg" viewBox="-35.72500000000002 -4 1168.9250000000002 598" width="1168.9250000000002" height="598"><defs><marker id="head-1e1e1e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e1e1e"/></marker></defs><rect x="-35.72500000000002" y="-4" width="1168.9250000000002" height="598" rx="10" fill="#ffffff"/><text x="40" y="38" font-family="Segoe UI, system-ui, sans-serif" font-size="18" fill="#1e1e1e"><tspan x="40" dy="0">Each project keeps its own status list (openspec/config.yaml, x-rtm.statuses)</tspan></text><rect x="40" y="60" width="300" height="120" rx="0" stroke="#1e1e1e" stroke-width="2" fill="#fff3bf" opacity="1"/><text x="190" y="108.625" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle"><tspan x="190" dy="0">Project A</tspan><tspan x="190" dy="16.25">Backlog · Planned · In Progress ·</tspan><tspan x="190" dy="16.25">Blocked · In Review · Completed</tspan></text><rect x="380" y="60" width="300" height="120" rx="0" stroke="#1e1e1e" stroke-width="2" fill="#fff3bf" opacity="1"/><text x="530" y="108.625" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle"><tspan x="530" dy="0">Project B</tspan><tspan x="530" dy="16.25">Backlog · Doing · InProgress ·</tspan><tspan x="530" dy="16.25">QA · completed</tspan></text><text x="40" y="213" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e1e1e"><tspan x="40" dy="0">Fixed in every project: Backlog, In Progress, Completed (never removed or renamed). Others: add, remove, reorder in Settings.</tspan></text><text x="40" y="278" font-family="Segoe UI, system-ui, sans-serif" font-size="18" fill="#1e1e1e"><tspan x="40" dy="0">Multi-project board: merge columns that mean the same (a view setting, per user, never written to a project)</tspan></text><rect x="40" y="300" width="150" height="60" rx="0" stroke="#1e1e1e" stroke-width="2" fill="#e9ecef" opacity="1"/><text x="115" y="334.875" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle"><tspan x="115" dy="0">In Progress (A)</tspan></text><rect x="210" y="300" width="150" height="60" rx="0" stroke="#1e1e1e" stroke-width="2" fill="#e9ecef" opacity="1"/><text x="285" y="334.875" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle"><tspan x="285" dy="0">InProgress (B)</tspan></text><rect x="380" y="300" width="150" height="60" rx="0" stroke="#1e1e1e" stroke-width="2" fill="#e9ecef" opacity="1"/><text x="455" y="334.875" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle"><tspan x="455" dy="0">Doing (B)</tspan></text><text x="40" y="382" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#1e1e1e"><tspan x="40" dy="0">Shift-select headers, header menu → Merge</tspan></text><polyline points="285,390 285,430" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linejoin="round" marker-end="url(#head-1e1e1e)"/><rect x="40" y="440" width="490" height="70" rx="0" stroke="#1e1e1e" stroke-width="2" fill="#d3f9d8" opacity="1"/><text x="285" y="471.75" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle"><tspan x="285" dy="0">In Progress  (A: In Progress · B: InProgress, Doing)</tspan><tspan x="285" dy="16.25">merges: [{ name, statuses }] in the user's board settings · Unmerge from the header</tspan></text><text x="40" y="542" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#1e1e1e"><tspan x="40" dy="0">Drop into a merged column: the card takes the status its own project has in the merge; if its project has two, the app asks which.</tspan></text><text x="40" y="567" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#1e1e1e"><tspan x="40" dy="0">Look-alikes of a fixed name (completed, InProgress, in progress) get a preselected "Merge with &lt;fixed&gt;" in the header menu.</tspan></text></svg>
