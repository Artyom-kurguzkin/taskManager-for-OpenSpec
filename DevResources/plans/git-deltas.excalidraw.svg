<svg xmlns="http://www.w3.org/2000/svg" viewBox="16 -4 908 414.25" width="908" height="414.25"><defs><marker id="head-1e1e1e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e1e1e"/></marker></defs><rect x="16" y="-4" width="908" height="414.25" rx="10" fill="#ffffff"/><text x="40" y="38" font-family="Segoe UI, system-ui, sans-serif" font-size="18" fill="#1e1e1e"><tspan x="40" dy="0">Which work items a commit (or the working tree) touched</tspan></text><rect x="40" y="60" width="260" height="110" rx="0" stroke="#1e1e1e" stroke-width="2" fill="#e9ecef" opacity="1"/><text x="170" y="103.625" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle"><tspan x="170" dy="0">git</tspan><tspan x="170" dy="16.25">show --name-only &lt;commit&gt;</tspan><tspan x="170" dy="16.25">status --porcelain (uncommitted)</tspan></text><rect x="360" y="60" width="260" height="110" rx="0" stroke="#1e1e1e" stroke-width="2" fill="#fff3bf" opacity="1"/><text x="490" y="103.625" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle"><tspan x="490" dy="0">paths under openspec/changes/&lt;folder&gt;/</tspan><tspan x="490" dy="16.25">(archive included)</tspan><tspan x="490" dy="16.25">→ the work item of that folder</tspan></text><polyline points="300,115 360,115" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linejoin="round" marker-end="url(#head-1e1e1e)"/><rect x="680" y="60" width="220" height="110" rx="0" stroke="#1e1e1e" stroke-width="2" fill="#d3f9d8" opacity="1"/><text x="790" y="111.75" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle"><tspan x="790" dy="0">cached per HEAD</tspan><tspan x="790" dy="16.25">(no git per render)</tspan></text><polyline points="620,115 680,115" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linejoin="round" marker-end="url(#head-1e1e1e)"/><rect x="40" y="220" width="260" height="120" rx="0" stroke="#1e1e1e" stroke-width="2" fill="#ffffff" opacity="1"/><text x="170" y="268.625" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle"><tspan x="170" dy="0">Filters › commit:</tspan><tspan x="170" dy="16.25">any (grey) · uncommitted ·</tspan><tspan x="170" dy="16.25">2ee9a45 ui bugs… · d74e2cc …</tspan></text><rect x="360" y="220" width="260" height="120" rx="0" stroke="#1e1e1e" stroke-width="2" fill="#ffffff" opacity="1"/><text x="490" y="268.625" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle"><tspan x="490" dy="0">board, list, calendar</tspan><tspan x="490" dy="16.25">show only the items</tspan><tspan x="490" dy="16.25">that commit touched</tspan></text><polyline points="300,280 360,280" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linejoin="round" marker-end="url(#head-1e1e1e)"/><rect x="680" y="220" width="220" height="120" rx="0" stroke="#1e1e1e" stroke-width="2" fill="#ffffff" opacity="1"/><text x="790" y="268.625" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle"><tspan x="790" dy="0">item page + examine panel:</tspan><tspan x="790" dy="16.25">Last commit: 2ee9a45 · subject</tspan><tspan x="790" dy="16.25">or "uncommitted changes"</tspan></text><text x="40" y="383" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e1e1e"><tspan x="40" dy="0">With the selector on "any", items with uncommitted changes carry a small muted dot by the title.</tspan></text></svg>
