<svg xmlns="http://www.w3.org/2000/svg" viewBox="9.449999999999989 -4 1169.95 550.5" width="1169.95" height="550.5"><defs><marker id="head-1e1e1e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e1e1e"/></marker></defs><rect x="9.449999999999989" y="-4" width="1169.95" height="550.5" rx="10" fill="#ffffff"/><text x="40" y="38" font-family="Segoe UI, system-ui, sans-serif" font-size="18" fill="#1e1e1e"><tspan x="40" dy="0">One sync pass today</tspan></text><rect x="40" y="60" width="230" height="70" rx="0" stroke="#1e1e1e" stroke-width="2" fill="#ffe3e3" opacity="1"/><text x="155" y="91.75" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle"><tspan x="155" dy="0">read + SHA-256 every file</tspan><tspan x="155" dy="16.25">3 times (markers, git guard, scan)</tspan></text><rect x="40" y="150" width="230" height="60" rx="0" stroke="#1e1e1e" stroke-width="2" fill="#ffe3e3" opacity="1"/><text x="155" y="176.75" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle"><tspan x="155" dy="0">new TLS connection</tspan><tspan x="155" dy="16.25">every pass</tspan></text><rect x="40" y="230" width="230" height="60" rx="0" stroke="#1e1e1e" stroke-width="2" fill="#fff3bf" opacity="1"/><text x="155" y="256.75" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle"><tspan x="155" dy="0">GET manifest if changed</tspan><tspan x="155" dy="16.25">(1 request, 304 when idle)</tspan></text><rect x="40" y="310" width="230" height="60" rx="0" stroke="#1e1e1e" stroke-width="2" fill="#ffe3e3" opacity="1"/><text x="155" y="336.75" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle"><tspan x="155" dy="0">objects one after another</tspan><tspan x="155" dy="16.25">all held in memory</tspan></text><rect x="40" y="390" width="230" height="60" rx="0" stroke="#1e1e1e" stroke-width="2" fill="#ffe3e3" opacity="1"/><text x="155" y="416.75" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle"><tspan x="155" dy="0">own downloads wake the</tspan><tspan x="155" dy="16.25">watcher: a second pass</tspan></text><text x="360" y="38" font-family="Segoe UI, system-ui, sans-serif" font-size="18" fill="#1e1e1e"><tspan x="360" dy="0">Proposed</tspan></text><rect x="360" y="60" width="230" height="70" rx="0" stroke="#1e1e1e" stroke-width="2" fill="#d3f9d8" opacity="1"/><text x="475" y="91.75" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle"><tspan x="475" dy="0">one walk, stat cache</tspan><tspan x="475" dy="16.25">(size + mtime), hash only changes</tspan></text><rect x="360" y="150" width="230" height="60" rx="0" stroke="#1e1e1e" stroke-width="2" fill="#d3f9d8" opacity="1"/><text x="475" y="176.75" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle"><tspan x="475" dy="0">one pooled connection</tspan><tspan x="475" dy="16.25">kept between passes</tspan></text><rect x="360" y="230" width="230" height="60" rx="0" stroke="#1e1e1e" stroke-width="2" fill="#fff3bf" opacity="1"/><text x="475" y="256.75" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle"><tspan x="475" dy="0">same GET, plus a light</tspan><tspan x="475" dy="16.25">idle check every few minutes</tspan></text><rect x="360" y="310" width="230" height="60" rx="0" stroke="#1e1e1e" stroke-width="2" fill="#d3f9d8" opacity="1"/><text x="475" y="336.75" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle"><tspan x="475" dy="0">4 to 8 objects at a time</tspan><tspan x="475" dy="16.25">streamed to temp files</tspan></text><rect x="360" y="390" width="230" height="60" rx="0" stroke="#1e1e1e" stroke-width="2" fill="#d3f9d8" opacity="1"/><text x="475" y="416.75" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle"><tspan x="475" dy="0">own writes known:</tspan><tspan x="475" dy="16.25">no second pass</tspan></text><polyline points="270,95 360,95" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linejoin="round" marker-end="url(#head-1e1e1e)"/><polyline points="270,180 360,180" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linejoin="round" marker-end="url(#head-1e1e1e)"/><polyline points="270,340 360,340" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linejoin="round" marker-end="url(#head-1e1e1e)"/><polyline points="270,420 360,420" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linejoin="round" marker-end="url(#head-1e1e1e)"/><text x="700" y="38" font-family="Segoe UI, system-ui, sans-serif" font-size="18" fill="#1e1e1e"><tspan x="700" dy="0">Agents and the sync</tspan></text><rect x="700" y="60" width="260" height="60" rx="0" stroke="#1e1e1e" stroke-width="2" fill="#e7f5ff" opacity="1"/><text x="830" y="86.75" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle"><tspan x="830" dy="0">agent writes a file</tspan><tspan x="830" dy="16.25">(board tool or direct edit)</tspan></text><rect x="700" y="150" width="260" height="60" rx="0" stroke="#1e1e1e" stroke-width="2" fill="#e7f5ff" opacity="1"/><text x="830" y="176.75" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle"><tspan x="830" dy="0">per-folder lock in the store:</tspan><tspan x="830" dy="16.25">app, server, worktrees never collide</tspan></text><rect x="700" y="240" width="260" height="60" rx="0" stroke="#1e1e1e" stroke-width="2" fill="#e7f5ff" opacity="1"/><text x="830" y="266.75" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle"><tspan x="830" dy="0">quiet timer restarts,</tspan><tspan x="830" dy="16.25">capped at 15 min since first change</tspan></text><rect x="700" y="330" width="260" height="60" rx="0" stroke="#1e1e1e" stroke-width="2" fill="#e7f5ff" opacity="1"/><text x="830" y="356.75" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle"><tspan x="830" dy="0">scan skips files written &lt; 10 s ago</tspan><tspan x="830" dy="16.25">and temp/editor files</tspan></text><rect x="700" y="420" width="260" height="60" rx="0" stroke="#1e1e1e" stroke-width="2" fill="#e7f5ff" opacity="1"/><text x="830" y="446.75" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle"><tspan x="830" dy="0">upload; card shows</tspan><tspan x="830" dy="16.25">"Claude, 3 min ago"</tspan></text><polyline points="830,120 830,150" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linejoin="round" marker-end="url(#head-1e1e1e)"/><polyline points="830,210 830,240" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linejoin="round" marker-end="url(#head-1e1e1e)"/><polyline points="830,300 830,330" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linejoin="round" marker-end="url(#head-1e1e1e)"/><polyline points="830,390 830,420" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linejoin="round" marker-end="url(#head-1e1e1e)"/><text x="40" y="503" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e1e1e"><tspan x="40" dy="0">R2 bill: $0 today and $0 after; the free tier is 100 to 1000 times today's load. What the proposals buy is wall time per pass (about 0.5 s), memory,</tspan><tspan x="40" dy="16.25">no torn or temp files in the storage, no lost writes between the app, the board server and agents, and a bound on how long an agent run can postpone a sync.</tspan></text></svg>
