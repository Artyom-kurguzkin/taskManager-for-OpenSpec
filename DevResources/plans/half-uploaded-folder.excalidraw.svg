<svg xmlns="http://www.w3.org/2000/svg" viewBox="16 -4 948 508" width="948" height="508"><defs><marker id="head-1e1e1e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e1e1e"/></marker></defs><rect x="16" y="-4" width="948" height="508" rx="10" fill="#ffffff"/><text x="40" y="42" font-family="Segoe UI, system-ui, sans-serif" font-size="22" fill="#1e1e1e"><tspan x="40" dy="0">#234: warn while files settle, repair a half-uploaded folder</tspan></text><rect x="40" y="80" width="260" height="90" rx="10" stroke="#1e1e1e" stroke-width="1" fill="#fff3bf" opacity="1"/><text x="170" y="121.5" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle"><tspan x="170" dy="0">Computer A merges items;</tspan><tspan x="170" dy="17.5">12 of 20 files still settling</tspan></text><rect x="360" y="80" width="260" height="90" rx="10" stroke="#1e1e1e" stroke-width="1" fill="#ffe8cc" opacity="1"/><text x="490" y="121.5" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle"><tspan x="490" dy="0">A closes: popup names the files</tspan><tspan x="490" dy="17.5">Wait and sync  |  Close anyway</tspan></text><rect x="680" y="80" width="260" height="90" rx="10" stroke="#1e1e1e" stroke-width="1" fill="#d3f9d8" opacity="1"/><text x="810" y="121.5" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle"><tspan x="810" dy="0">Wait: settle, then one exit sync</tspan><tspan x="810" dy="17.5">uploads the folder whole</tspan></text><polyline points="300,125 360,125" fill="none" stroke="#1e1e1e" stroke-width="1" stroke-linejoin="round" marker-end="url(#head-1e1e1e)"/><polyline points="620,125 680,125" fill="none" stroke="#1e1e1e" stroke-width="1" stroke-linejoin="round" marker-end="url(#head-1e1e1e)"/><rect x="360" y="230" width="260" height="90" rx="10" stroke="#1e1e1e" stroke-width="1" fill="#ffe3e3" opacity="1"/><text x="490" y="262.75" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle"><tspan x="490" dy="0">Close anyway (or a crash):</tspan><tspan x="490" dy="17.5">the planner still uploads the</tspan><tspan x="490" dy="17.5">folder whole or not at all</tspan></text><polyline points="490,170 490,230" fill="none" stroke="#1e1e1e" stroke-width="1" stroke-linejoin="round" marker-end="url(#head-1e1e1e)"/><rect x="40" y="380" width="260" height="100" rx="10" stroke="#1e1e1e" stroke-width="1" fill="#d0ebff" opacity="1"/><text x="170" y="417.75" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle"><tspan x="170" dy="0">Storage holds a partial folder</tspan><tspan x="170" dy="17.5">(old build, or a crash mid-pass):</tspan><tspan x="170" dy="17.5">notes but no .openspec.yaml</tspan></text><rect x="360" y="380" width="260" height="100" rx="10" stroke="#1e1e1e" stroke-width="1" fill="#e9ecef" opacity="1"/><text x="490" y="417.75" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle"><tspan x="490" dy="0">Computer B: incomplete folder is</tspan><tspan x="490" dy="17.5">held back, not downloaded;</tspan><tspan x="490" dy="17.5">source notes keep their ids</tspan></text><rect x="680" y="380" width="260" height="100" rx="10" stroke="#1e1e1e" stroke-width="1" fill="#d3f9d8" opacity="1"/><text x="810" y="417.75" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle"><tspan x="810" dy="0">Computer A's next sync uploads</tspan><tspan x="810" dy="17.5">the rest; the folder is complete</tspan><tspan x="810" dy="17.5">and B follows the merge</tspan></text><polyline points="300,430 360,430" fill="none" stroke="#1e1e1e" stroke-width="1" stroke-linejoin="round" marker-end="url(#head-1e1e1e)"/><polyline points="620,430 680,430" fill="none" stroke="#1e1e1e" stroke-width="1" stroke-linejoin="round" marker-end="url(#head-1e1e1e)"/><text x="40" y="361" font-family="Segoe UI, system-ui, sans-serif" font-size="16" fill="#1e1e1e"><tspan x="40" dy="0">Repair, when it happened anyway:</tspan></text></svg>
