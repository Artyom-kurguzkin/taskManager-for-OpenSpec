<svg xmlns="http://www.w3.org/2000/svg" viewBox="-4 16 998 433" width="998" height="433"><defs><marker id="head-1e1e1e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e1e1e"/></marker></defs><rect x="-4" y="16" width="998" height="433" rx="10" fill="#ffffff"/><rect x="20" y="40" width="330" height="330" rx="10" stroke="#4a9eed" stroke-width="1" fill="#dbe4ff" opacity="0.4"/><text x="36" y="68" font-family="Segoe UI, system-ui, sans-serif" font-size="18" fill="#1c5fa8"><tspan x="36" dy="0">This computer, in the repository</tspan></text><rect x="50" y="100" width="270" height="90" rx="10" stroke="#1e1e1e" stroke-width="2" fill="#a5d8ff" opacity="1"/><text x="185" y="141" font-family="Segoe UI, system-ui, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="185" dy="0">Board files</tspan><tspan x="185" dy="20">openspec/changes (in git)</tspan></text><rect x="50" y="250" width="270" height="90" rx="10" stroke="#1e1e1e" stroke-width="2" fill="#ffd8a8" opacity="1"/><text x="185" y="291" font-family="Segoe UI, system-ui, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="185" dy="0">Attachments folder</tspan><tspan x="185" dy="20">local/task-tracking (not in git)</tspan></text><rect x="640" y="40" width="330" height="330" rx="10" stroke="#22c55e" stroke-width="1" fill="#d3f9d8" opacity="0.4"/><text x="656" y="68" font-family="Segoe UI, system-ui, sans-serif" font-size="18" fill="#15803d"><tspan x="656" dy="0">Connected storage</tspan></text><rect x="670" y="100" width="270" height="90" rx="10" stroke="#1e1e1e" stroke-width="2" fill="#c3fae8" opacity="1"/><text x="805" y="141" font-family="Segoe UI, system-ui, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="805" dy="0">manifest.json, objects/</tspan><tspan x="805" dy="20">merged by kind of file</tspan></text><rect x="670" y="250" width="270" height="90" rx="10" stroke="#