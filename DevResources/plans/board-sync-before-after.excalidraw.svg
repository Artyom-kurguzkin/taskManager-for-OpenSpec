<svg xmlns="http://www.w3.org/2000/svg" viewBox="11.25 -4 993.85 548" width="993.85" height="548"><defs><marker id="head-1e1e1e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e1e1e"/></marker></defs><rect x="11.25" y="-4" width="993.85" height="548" rx="10" fill="#ffffff"/><text x="40" y="42" font-family="Segoe UI, system-ui, sans-serif" font-size="22" fill="#1e1e1e"><tspan x="40" dy="0">Board sync, before and after #233</tspan></text><text x="40" y="88" font-family="Segoe UI, system-ui, sans-serif" font-size="18" fill="#c92a2a"><tspan x="40" dy="0">BEFORE</tspan></text><rect x="40" y="110" width="260" height="90" rx="10" stroke="#1e1e1e" stroke-width="1" fill="#fff3bf" opacity="1"/><text x="170" y="151.5" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle"><tspan x="170" dy="0">Other computer merges 9 items</tspan><tspan x="170" dy="17.5">(source folders removed)</tspan></text><rect x="360" y="110" width="260" height="90" rx="10" stroke="#1e1e1e" stroke-width="1" fill="#d0ebff" opacity="1"/><text x="490" y="160.25" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle"><tspan x="490" dy="0">Storage: 48 "deleted" markers</tspan></text><rect x="680" y="110" width="260" height="90" rx="10" stroke="#1e1e1e" stroke-width="1" fill="#ffe3e3" opacity="1"/><text x="810" y="151.5" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle"><tspan x="810" dy="0">This computer: missing = deleted</tspan><tspan x="810" dy="17.5">48 of 77 &gt; 30%: brake, paused</tspan></text><polyline points="300,155 360,155" fill="none" stroke="#1e1e1e" stroke-width="1" stroke-linejoin="round" marker-end="url(#head-1e1e1e)"/><polyline points="620,155 680,155" fill="none" stroke="#1e1e1e" stroke-width="1" stroke-linejoin="round" marker-end="url(#head-1e1e1e)"/><text x="40" y="268" font-family="Segoe UI, system-ui, sans-serif" font-size="18" fill="#2b8a3e"><tspan x="40" dy="0">AFTER</tspan></text><rect x="40" y="290" width="260" height="110" rx="10" stroke="#1e1e1e" stroke-width="1" fill="#fff3bf" opacity="1"/><text x="170" y="332.75" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle"><tspan x="170" dy="0">App logs every move:</tspan><tspan x="170" dy="17.5">archived, spec-removed, spec-moved,</tspan><tspan x="170" dy="17.5">attachment-removed (+ mergedFrom)</tspan></text><rect x="360" y="290" width="260" height="110" rx="10" stroke="#1e1e1e" stroke-width="1" fill="#d0ebff" opacity="1"/><text x="490" y="332.75" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle"><tspan x="490" dy="0">Storage: same markers,</tspan><tspan x="490" dy="17.5">list stamped with the project's</tspan><tspan x="490" dy="17.5">first commit</tspan></text><rect x="680" y="290" width="260" height="110" rx="10" stroke="#1e1e1e" stroke-width="1" fill="#d3f9d8" opacity="1"/><text x="810" y="332.75" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle"><tspan x="810" dy="0">Folder pass by id: archived?</tspan><tspan x="810" dy="17.5">merged? renamed? -&gt; follow it,</tspan><tspan x="810" dy="17.5">carry edits. Else: put back.</tspan></text><polyline points="300,345 360,345" fill="none" stroke="#1e1e1e" stroke-width="1" stroke-linejoin="round" marker-end="url(#head-1e1e1e)"/><polyline points="620,345 680,345" fill="none" stroke="#1e1e1e" stroke-width="1" stroke-linejoin="round" marker-end="url(#head-1e1e1e)"/><rect x="360" y="440" width="580" height="80" rx="10" stroke="#1e1e1e" stroke-width="1" fill="#e9ecef" opacity="1"/><text x="650" y="476.5" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle"><tspan x="650" dy="0">Result: the 9 folders become the merged item, nothing deleted, no brake,</tspan><tspan x="650" dy="17.5">a `sync` line on each item says what happened. Removed only with a log line behind it.</tspan></text><polyline points="810,400 810,440" fill="none" stroke="#1e1e1e" stroke-width="1" stroke-linejoin="round" marker-end="url(#head-1e1e1e)"/></svg>
