<svg xmlns="http://www.w3.org/2000/svg" viewBox="16 -4 1088 439.25" width="1088" height="439.25"><defs><marker id="head-1e1e1e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e1e1e"/></marker></defs><rect x="16" y="-4" width="1088" height="439.25" rx="10" fill="#ffffff"/><text x="40" y="38" font-family="Segoe UI, system-ui, sans-serif" font-size="18" fill="#1e1e1e"><tspan x="40" dy="0">Where things live (the reference solution's rules)</tspan></text><text x="40" y="63" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e1e1e"><tspan x="40" dy="0">3am rule: could the MCP server need it with no window open?  yes → module   no → host</tspan></text><rect x="40" y="80" width="820" height="150" rx="0" stroke="#1e1e1e" stroke-width="2" fill="#e7f5ff" opacity="1"/><text x="450" y="101" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle"><tspan x="450" dy="0">Host: TaskManager, every caller, one process</tspan><tspan x="450" dy="16.25">Program.cs · AppState/ (UI state, all caches) · Helpers/ · BackgroundJobs/ (timer loops)</tspan><tspan x="450" dy="16.25">Components/: Layout · Pages/&lt;Feature&gt; · Shared · RtmComponent base</tspan><tspan x="450" dy="16.25">Mcp/ (tools, relay) · Api/ (listener, endpoints) · Acp/ (later)</tspan></text><rect x="40" y="270" width="130" height="110" rx="0" stroke="#1e1e1e" stroke-width="2" fill="#ffe8cc" opacity="1"/><text x="105" y="291" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle"><tspan x="105" dy="0">OpenSpecStore</tspan><tspan x="105" dy="16.25"></tspan><tspan x="105" dy="16.25">config.yaml reader/writer</tspan><tspan x="105" dy="16.25">#wi / #n / [[doc]] grammar</tspan><tspan x="105" dy="16.25">openspec watcher + Version</tspan></text><rect x="178" y="270" width="130" height="110" rx="0" stroke="#1e1e1e" stroke-width="2" fill="#ffe8cc" opacity="1"/><text x="243" y="291" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle"><tspan x="243" dy="0">GitHistory</tspan><tspan x="243" dy="16.25"></tspan><tspan x="243" dy="16.25">.git watcher + HeadVersion</tspan><tspan x="243" dy="16.25">HEAD, uncommitted,</tspan><tspan x="243" dy="16.25">last commit cached</tspan></text><rect x="316" y="270" width="130" height="110" rx="0" stroke="#1e1e1e" stroke-width="2" fill="#ffe8cc" opacity="1"/><text x="381" y="291" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle"><tspan x="381" dy="0">WorkItems</tspan><tspan x="381" dy="16.25"></tspan><tspan x="381" dy="16.25">field catalog</tspan><tspan x="381" dy="16.25">parsed events</tspan><tspan x="381" dy="16.25">people directory</tspan></text><rect x="454" y="270" width="130" height="110" rx="0" stroke="#1e1e1e" stroke-width="2" fill="#ffe8cc" opacity="1"/><text x="519" y="291" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle"><tspan x="519" dy="0">Notes</tspan><tspan x="519" dy="16.25"></tspan><tspan x="519" dy="16.25">[[doc]] containment</tspan><tspan x="519" dy="16.25">safe attachment bytes</tspan></text><rect x="592" y="270" width="130" height="110" rx="0" stroke="#1e1e1e" stroke-width="2" fill="#ffe8cc" opacity="1"/><text x="657" y="291" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle"><tspan x="657" dy="0">BoardSync</tspan><tspan x="657" dy="16.25"></tspan><tspan x="657" dy="16.25">storage + sync rules</tspan><tspan x="657" dy="16.25">status without writes</tspan></text><rect x="730" y="270" width="130" height="110" rx="0" stroke="#1e1e1e" stroke-width="2" fill="#ffe8cc" opacity="1"/><text x="795" y="291" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle"><tspan x="795" dy="0">Features · LinkedTestRuns</tspan><tspan x="795" dy="16.25"></tspan><tspan x="795" dy="16.25">caches keyed with</tspan><tspan x="795" dy="16.25">repo generation</tspan></text><text x="40" y="408" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e1e1e"><tspan x="40" dy="0">Each module: its own reads, its own cache (rebuilt only when a version it read moves), its own change signal. No shared kernel.</tspan></text><rect x="880" y="80" width="200" height="300" rx="0" stroke="#1e1e1e" stroke-width="2" fill="#ffe3e3" opacity="1"/><text x="980" y="101" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle"><tspan x="980" dy="0">Enforcement</tspan><tspan x="980" dy="16.25"></tspan><tspan x="980" dy="16.25">ModuleBoundaryTests</tspan><tspan x="980" dy="16.25">(+ BoardSync)</tspan><tspan x="980" dy="16.25"></tspan><tspan x="980" dy="16.25">architecture test:</tspan><tspan x="980" dy="16.25">base class, parameter</tspan><tspan x="980" dy="16.25">rules, fixed cascades</tspan><tspan x="980" dy="16.25"></tspan><tspan x="980" dy="16.25">render budgets</tspan><tspan x="980" dy="16.25">per screen</tspan><tspan x="980" dy="16.25"></tspan><tspan x="980" dy="16.25">second render</tspan><tspan x="980" dy="16.25">reads no files</tspan></text><polyline points="450,230 450,270" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linejoin="round" marker-end="url(#head-1e1e1e)"/></svg>
