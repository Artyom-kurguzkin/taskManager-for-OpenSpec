<svg xmlns="http://www.w3.org/2000/svg" viewBox="-4 -4 884 740" width="884" height="740"><defs><marker id="head-1e1e1e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e1e1e"/></marker></defs><rect x="-4" y="-4" width="884" height="740" rx="10" fill="#ffffff"/><rect x="20" y="20" width="620" height="56" rx="10" stroke="#1e1e1e" stroke-width="2" fill="#f1f3f5" opacity="1"/><text x="330" y="54" font-family="Segoe UI, system-ui, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="330" dy="0">1. Pause if git is mid-merge; repair conflict markers</tspan></text><polyline points="330,76 330,104" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linejoin="round" marker-end="url(#head-1e1e1e)"/><rect x="20" y="104" width="620" height="56" rx="10" stroke="#1e1e1e" stroke-width="2" fill="#f1f3f5" opacity="1"/><text x="330" y="138" font-family="Segoe UI, system-ui, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="330" dy="0">2. Scan the board files on this computer</tspan></text><polyline points="330,160 330,188" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linejoin="round" marker-end="url(#head-1e1e1e)"/><rect x="20" y="188" width="620" height="56" rx="10" stroke="#1e1e1e" stroke-width="2" fill="#f1f3f5" opacity="1"/><text x="330" y="222" font-family="Segoe UI, system-ui, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="330" dy="0">3. Read the list of files in the bucket</tspan></text><polyline points="330,244 330,272" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linejoin="round" marker-end="url(#head-1e1e1e)"/><rect x="20" y="272" width="620" height="56" rx="10" stroke="#1e1e1e" stroke-width="2" fill="#b2f2bb" opacity="1"/><text x="330" y="306" font-family="Segoe UI, system-ui, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="330" dy="0">4. NEW: check the bucket belongs to this project</tspan></text><polyline points="330,328 330,356" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linejoin="round" marker-end="url(#head-1e1e1e)"/><rect x="20" y="356" width="620" height="80" rx="10" stroke="#1e1e1e" stroke-width="2" fill="#b2f2bb" opacity="1"/><text x="330" y="392" font-family="Segoe UI, system-ui, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="330" dy="0">5. NEW: folder pass: find where each missing change went</tspan><tspan x="330" dy="20">(archive, merged item, renamed) or mark it to be put back</tspan></text><polyline points="330,436 330,464" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linejoin="round" marker-end="url(#head-1e1e1e)"/><rect x="20" y="464" width="620" height="80" rx="10" stroke="#1e1e1e" stroke-width="2" fill="#ffec99" opacity="1"/><text x="330" y="500" font-family="Segoe UI, system-ui, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="330" dy="0">6. File pass: three-way merge per file</tspan><tspan x="330" dy="20">CHANGED: a missing file is put back unless the log covers it</tspan></text><polyline points="330,544 330,572" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linejoin="round" marker-end="url(#head-1e1e1e)"/><rect x="20" y="572" width="620" height="56" rx="10" stroke="#1e1e1e" stroke-width="2" fill="#f1f3f5" opacity="1"/><text x="330" y="606" font-family="Segoe UI, system-ui, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="330" dy="0">7. Upload, then write merged files here (old copies to the trash)</tspan></text><polyline points="330,628 330,656" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linejoin="round" marker-end="url(#head-1e1e1e)"/><rect x="20" y="656" width="620" height="56" rx="10" stroke="#1e1e1e" stroke-width="2" fill="#b2f2bb" opacity="1"/><text x="330" y="690" font-family="Segoe UI, system-ui, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="330" dy="0">8. NEW: write what the sync did on each item it touched</tspan></text><text x="680" y="46" font-family="Segoe UI, system-ui, sans-serif" font-size="16" fill="#1e1e1e"><tspan x="680" dy="0">grey: as today</tspan><tspan x="680" dy="20">green: new</tspan><tspan x="680" dy="20">yellow: changed rule</tspan></text></svg>
