<svg xmlns="http://www.w3.org/2000/svg" viewBox="176 -4 978 900.5" width="978" height="900.5"><defs><marker id="head-1e1e1e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e1e1e"/></marker></defs><rect x="176" y="-4" width="978" height="900.5" rx="10" fill="#ffffff"/><rect x="230" y="20" width="380" height="80" rx="10" stroke="#1e1e1e" stroke-width="2" fill="#a5d8ff" opacity="1"/><text x="420" y="56" font-family="Segoe UI, system-ui, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="420" dy="0">A change folder is on one computer</tspan><tspan x="420" dy="20">but missing on the other</tspan></text><polyline points="420,100 420,140" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linejoin="round" marker-end="url(#head-1e1e1e)"/><polygon points="420,140 640,215 420,290 200,215" stroke="#1e1e1e" stroke-width="2" fill="#fff3bf" opacity="1"/><text x="420" y="211" font-family="Segoe UI, system-ui, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="420" dy="0">Is a change with the same id</tspan><tspan x="420" dy="20">in the archive?</tspan></text><polyline points="640,215 730,215" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linejoin="round" marker-end="url(#head-1e1e1e)"/><text x="668" y="205" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e1e1e"><tspan x="668" dy="0">yes</tspan></text><rect x="730" y="160" width="400" height="110" rx="10" stroke="#1e1e1e" stroke-width="2" fill="#ffec99" opacity="1"/><text x="930" y="201" font-family="Segoe UI, system-ui, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="930" dy="0">Archive it here too</tspan><tspan x="930" dy="20">edits from the other computer are</tspan><tspan x="930" dy="20">merged into the archived copy</tspan></text><polyline points="420,290 420,340" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linejoin="round" marker-end="url(#head-1e1e1e)"/><text x="432" y="320" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e1e1e"><tspan x="432" dy="0">no</tspan></text><polygon points="420,340 640,415 420,490 200,415" stroke="#1e1e1e" stroke-width="2" fill="#fff3bf" opacity="1"/><text x="420" y="411" font-family="Segoe UI, system-ui, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="420" dy="0">Does another item say</tspan><tspan x="420" dy="20">merged-from this one?</tspan></text><polyline points="640,415 730,415" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linejoin="round" marker-end="url(#head-1e1e1e)"/><text x="668" y="405" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e1e1e"><tspan x="668" dy="0">yes</tspan></text><rect x="730" y="360" width="400" height="110" rx="10" stroke="#1e1e1e" stroke-width="2" fill="#ffec99" opacity="1"/><text x="930" y="401" font-family="Segoe UI, system-ui, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="930" dy="0">It lives in the merged item</tspan><tspan x="930" dy="20">edits from the other computer are</tspan><tspan x="930" dy="20">carried into the merged item</tspan></text><polyline points="420,490 420,540" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linejoin="round" marker-end="url(#head-1e1e1e)"/><text x="432" y="520" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e1e1e"><tspan x="432" dy="0">no</tspan></text><polygon points="420,540 640,615 420,690 200,615" stroke="#1e1e1e" stroke-width="2" fill="#fff3bf" opacity="1"/><text x="420" y="611" font-family="Segoe UI, system-ui, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="420" dy="0">Is the same id under</tspan><tspan x="420" dy="20">another folder name?</tspan></text><polyline points="640,615 730,615" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linejoin="round" marker-end="url(#head-1e1e1e)"/><text x="668" y="605" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e1e1e"><tspan x="668" dy="0">yes</tspan></text><rect x="730" y="560" width="400" height="110" rx="10" stroke="#1e1e1e" stroke-width="2" fill="#ffec99" opacity="1"/><text x="930" y="611" font-family="Segoe UI, system-ui, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="930" dy="0">Rename it here too</tspan><tspan x="930" dy="20">and merge the two copies</tspan></text><polyline points="420,690 420,740" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linejoin="round" marker-end="url(#head-1e1e1e)"/><text x="432" y="720" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e1e1e"><tspan x="432" dy="0">no</tspan></text><rect x="230" y="740" width="380" height="80" rx="10" stroke="#1e1e1e" stroke-width="2" fill="#b2f2bb" opacity="1"/><text x="420" y="776" font-family="Segoe UI, system-ui, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="420" dy="0">Put the folder back</tspan><tspan x="420" dy="20">and note it in its event log</tspan></text><text x="230" y="868" font-family="Segoe UI, system-ui, sans-serif" font-size="18" fill="#1e1e1e"><tspan x="230" dy="0">A sync never deletes a change. Whatever loses a clash is written on the item.</tspan></text></svg>
