<svg xmlns="http://www.w3.org/2000/svg" viewBox="-24 -24 1198 888" width="1198" height="888"><defs><marker id="head-1e1e1e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e1e1e"/></marker><marker id="head-ef4444" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef4444"/></marker></defs><rect x="-24" y="-24" width="1198" height="888" rx="10" fill="#ffffff"/><text x="330" y="24" font-family="Segoe UI, system-ui, sans-serif" font-size="24" fill="#1e1e1e"><tspan x="330" dy="0">One user action: today, and after the change</tspan></text><rect x="0" y="50" width="1150" height="330" rx="10" stroke="#ef4444" stroke-width="1" fill="#ffc9c9" opacity="0.3"/><text x="20" y="76" font-family="Segoe UI, system-ui, sans-serif" font-size="18" fill="#b91c1c"><tspan x="20" dy="0">Today: everything runs on the UI thread before the first frame</tspan></text><rect x="20" y="110" width="150" height="70" rx="10" stroke="#1e1e1e" stroke-width="2" fill="#a5d8ff" opacity="1"/><text x="95" y="151" font-family="Segoe UI, system-ui, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="95" dy="0">key / click</tspan></text><polyline points="170,145 210,145" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linejoin="round" marker-end="url(#head-1e1e1e)"/><rect x="210" y="110" width="170" height="70" rx="10" stroke="#1e1e1e" stroke-width="2" fill="#ffd8a8" opacity="1"/><text x="295" y="141.5" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle"><tspan x="295" dy="0">write file</tspan><tspan x="295" dy="17.5">lock wait up to 5 s</tspan></text><polyline points="380,145 420,145" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linejoin="round" marker-end="url(#head-1e1e1e)"/><rect x="420" y="110" width="190" height="70" rx="10" stroke="#1e1e1e" stroke-width="2" fill="#ffd8a8" opacity="1"/><text x="515" y="141.5" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle"><tspan x="515" dy="0">Notify: walk every</tspan><tspan x="515" dy="17.5">folder, archive too</tspan></text><polyline points="610,145 650,145" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linejoin="round" marker-end="url(#head-1e1e1e)"/><rect x="650" y="110" width="180" height="70" rx="10" stroke="#1e1e1e" stroke-width="2" fill="#ffd8a8" opacity="1"/><text x="740" y="141.5" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle"><tspan x="740" dy="0">Changed: every page</tspan><tspan x="740" dy="17.5">reloads, git status</tspan></text><polyline points="830,145 870,145" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linejoin="round" marker-end="url(#head-1e1e1e)"/><rect x="870" y="110" width="150" height="70" rx="10" stroke="#1e1e1e" stroke-width="2" fill="#ffd8a8" opacity="1"/><text x="945" y="141.5" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle"><tspan x="945" dy="0">settings.json</tspan><tspan x="945" dy="17.5">write + fan-out</tspan></text><polyline points="945,180 945,240" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linejoin="round" marker-end="url(#head-1e1e1e)"/><rect x="870" y="240" width="150" height="70" rx="10" stroke="#1e1e1e" stroke-width="2" fill="#b2f2bb" opacity="1"/><text x="945" y="281" font-family="Segoe UI, system-ui, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="945" dy="0">first frame</tspan></text><text x="20" y="266" font-family="Segoe UI, system-ui, sans-serif" font-size="16" fill="#b91c1c"><tspan x="20" dy="0">6-10 config.yaml reads, two full redraws per drag, the window frozen the whole time</tspan></text><text x="20" y="344" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#757575"><tspan x="20" dy="0">Only the write and one re-projection are needed to show the result. Even the write can follow the frame.</tspan></text><rect x="0" y="420" width="1150" height="420" rx="10" stroke="#22c55e" stroke-width="1" fill="#d3f9d8" opacity="0.3"/><text x="20" y="446" font-family="Segoe UI, system-ui, sans-serif" font-size="18" fill="#15803d"><tspan x="20" dy="0">After: render first, persist after, off the UI thread</tspan></text><rect x="20" y="480" width="150" height="70" rx="10" stroke="#1e1e1e" stroke-width="2" fill="#a5d8ff" opacity="1"/><text x="95" y="521" font-family="Segoe UI, system-ui, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="95" dy="0">key / click</tspan></text><polyline points="170,515 210,515" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linejoin="round" marker-end="url(#head-1e1e1e)"/><rect x="210" y="480" width="190" height="70" rx="10" stroke="#1e1e1e" stroke-width="2" fill="#d0bfff" opacity="1"/><text x="305" y="511.5" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle"><tspan x="305" dy="0">mutate the model</tspan><tspan x="305" dy="17.5">in memory</tspan></text><polyline points="400,515 440,515" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linejoin="round" marker-end="url(#head-1e1e1e)"/><rect x="440" y="480" width="190" height="70" rx="10" stroke="#1e1e1e" stroke-width="2" fill="#b2f2bb" opacity="1"/><text x="535" y="511" font-family="Segoe UI, system-ui, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="535" dy="0">first frame</tspan><tspan x="535" dy="20">under 50 ms</tspan></text><polyline points="630,515 670,515" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linejoin="round" marker-end="url(#head-1e1e1e)"/><rect x="626.75" y="504.25" width="46.5" height="21.5" fill="#ffffff"/><text x="650" y="520.25" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle"><tspan x="650" dy="0">yield</tspan></text><rect x="670" y="480" width="180" height="70" rx="10" stroke="#1e1e1e" stroke-width="2" fill="#c3fae8" opacity="1"/><text x="760" y="511.5" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle"><tspan x="760" dy="0">write the file</tspan><tspan x="760" dy="17.5">(thread pool)</tspan></text><polyline points="760,550 760,600" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linejoin="round" marker-end="url(#head-1e1e1e)"/><rect x="670" y="600" width="180" height="70" rx="10" stroke="#1e1e1e" stroke-width="2" fill="#c3fae8" opacity="1"/><text x="760" y="631.5" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle"><tspan x="760" dy="0">Notify, scan, git</tspan><tspan x="760" dy="17.5">(thread pool)</tspan></text><polyline points="670,635 490,635" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linejoin="round" stroke-dasharray="8 6" marker-end="url(#head-1e1e1e)"/><rect x="549.05" y="624.25" width="61.900000000000006" height="21.5" fill="#ffffff"/><text x="580" y="640.25" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle"><tspan x="580" dy="0">Changed</tspan></text><polygon points="395,590 490,635 395,680 300,635" stroke="#1e1e1e" stroke-width="2" fill="#fff3bf" opacity="1"/><text x="395" y="631.5" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle"><tspan x="395" dy="0">own write?</tspan><tspan x="395" dy="17.5">(version match)</tspan></text><polyline points="300,635 200,635" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linejoin="round" marker-end="url(#head-1e1e1e)"/><rect x="234.45" y="624.25" width="31.1" height="21.5" fill="#ffffff"/><text x="250" y="640.25" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle"><tspan x="250" dy="0">yes</tspan></text><rect x="40" y="600" width="160" height="70" rx="10" stroke="#1e1e1e" stroke-width="2" fill="#b2f2bb" opacity="1"/><text x="120" y="631.5" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle"><tspan x="120" dy="0">skip: already</tspan><tspan x="120" dy="17.5">on screen</tspan></text><polyline points="395,680 395,730" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linejoin="round" marker-end="url(#head-1e1e1e)"/><rect x="302.45" y="694.25" width="185.10000000000002" height="21.5" fill="#ffffff"/><text x="395" y="710.25" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle"><tspan x="395" dy="0">no: agent, git, watcher</tspan></text><rect x="300" y="730" width="190" height="70" rx="10" stroke="#1e1e1e" stroke-width="2" fill="#a5d8ff" opacity="1"/><text x="395" y="761.5" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle"><tspan x="395" dy="0">reload one item,</tspan><tspan x="395" dy="17.5">InvokeAsync</tspan></text><rect x="870" y="480" width="260" height="70" rx="10" stroke="#1e1e1e" stroke-width="2" fill="#ffc9c9" opacity="1"/><text x="1000" y="511.5" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle"><tspan x="1000" dy="0">write failed: roll back</tspan><tspan x="1000" dy="17.5">the model, toast</tspan></text><polyline points="850,515 870,515" fill="none" stroke="#ef4444" stroke-width="2" stroke-linejoin="round" marker-end="url(#head-ef4444)"/><text x="20" y="824" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#757575"><tspan x="20" dy="0">config.yaml cached behind the store version; settings.json debounced and skipped when equal</tspan></text></svg>
