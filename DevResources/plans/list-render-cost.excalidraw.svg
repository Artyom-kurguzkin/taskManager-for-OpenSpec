<svg xmlns="http://www.w3.org/2000/svg" viewBox="16 -4 1020.4000000000001 384.25" width="1020.4000000000001" height="384.25"><defs><marker id="head-1e1e1e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e1e1e"/></marker></defs><rect x="16" y="-4" width="1020.4000000000001" height="384.25" rx="10" fill="#ffffff"/><text x="40" y="38" font-family="Segoe UI, system-ui, sans-serif" font-size="18" fill="#1e1e1e"><tspan x="40" dy="0">One click in the list today</tspan></text><rect x="40" y="60" width="220" height="70" rx="0" stroke="#1e1e1e" stroke-width="2" fill="#ffe3e3" opacity="1"/><text x="150" y="91.75" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle"><tspan x="150" dy="0">click bubbles through</tspan><tspan x="150" dy="16.25">3 handlers → 3 page renders</tspan></text><rect x="300" y="60" width="220" height="70" rx="0" stroke="#1e1e1e" stroke-width="2" fill="#ffe3e3" opacity="1"/><text x="410" y="91.75" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle"><tspan x="410" dy="0">grid gets new fragments</tspan><tspan x="410" dy="16.25">→ re-renders twice (Reload)</tspan></text><rect x="560" y="60" width="260" height="70" rx="0" stroke="#1e1e1e" stroke-width="2" fill="#ffe3e3" opacity="1"/><text x="690" y="91.75" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle"><tspan x="690" dy="0">every row, every pill:</tspan><tspan x="690" dy="16.25">Pill → Dropdown → RadzenDropDown → items</tspan></text><polyline points="260,95 300,95" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linejoin="round" marker-end="url(#head-1e1e1e)"/><polyline points="520,95 560,95" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linejoin="round" marker-end="url(#head-1e1e1e)"/><text x="40" y="158" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e1e1e"><tspan x="40" dy="0">≈ 5,600 component renders per click with 60 rows; 84 % are the pill editors. 100–210 ms in the real app, linear in rows.</tspan></text><text x="40" y="218" font-family="Segoe UI, system-ui, sans-serif" font-size="18" fill="#1e1e1e"><tspan x="40" dy="0">Proposed</tspan></text><rect x="40" y="240" width="240" height="80" rx="0" stroke="#1e1e1e" stroke-width="2" fill="#d3f9d8" opacity="1"/><text x="160" y="268.625" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle"><tspan x="160" dy="0">1 pills as plain markup,</tspan><tspan x="160" dy="16.25">one shared picker on demand</tspan><tspan x="160" dy="16.25">(−84 % renders)</tspan></text><rect x="310" y="240" width="240" height="80" rx="0" stroke="#1e1e1e" stroke-width="2" fill="#d3f9d8" opacity="1"/><text x="430" y="268.625" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle"><tspan x="430" dy="0">2 handlers that change nothing</tspan><tspan x="430" dy="16.25">do not render</tspan><tspan x="430" dy="16.25">(3 passes → 1)</tspan></text><rect x="580" y="240" width="240" height="80" rx="0" stroke="#1e1e1e" stroke-width="2" fill="#fff3bf" opacity="1"/><text x="700" y="268.625" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle"><tspan x="700" dy="0">3 grid in its own component,</tspan><tspan x="700" dy="16.25">selection marks outside it</tspan><tspan x="700" dy="16.25">(examine/select: 0 grid renders)</tspan></text><text x="40" y="353" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1e1e1e"><tspan x="40" dy="0">Each step is proven by a render-count test (RowRenders, FindComponents), not by timing. Virtualization only if long lists still need it.</tspan></text></svg>
