<svg xmlns="http://www.w3.org/2000/svg" viewBox="-4 -14 1164.15 528" width="1164.15" height="528"><defs><marker id="head-1e1e1e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e1e1e"/></marker></defs><rect x="-4" y="-14" width="1164.15" height="528" rx="10" fill="#ffffff"/><text x="20" y="30" font-family="Segoe UI, system-ui, sans-serif" font-size="20" fill="#1e1e1e"><tspan x="20" dy="0">Why var density wants to delete 48 of 77 files (#233)</tspan></text><rect x="20" y="60" width="300" height="150" rx="10" stroke="#1e1e1e" stroke-width="2" fill="#fff3bf" opacity="1"/><text x="170" y="114" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle"><tspan x="170" dy="0">Other computer 07189f54</tspan><tspan x="170" dy="17.5">Nov 25 10:42 local: merges 9 items</tspan><tspan x="170" dy="17.5">into merge-wi8-wi17</tspan><tspan x="170" dy="17.5">(source folders removed)</tspan></text><rect x="400" y="60" width="330" height="150" rx="10" stroke="#1e1e1e" stroke-width="2" fill="#e7f5ff" opacity="1"/><text x="565" y="105.25" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle"><tspan x="565" dy="0">Bucket repo-tasks, prefix var-density/</tspan><tspan x="565" dy="17.5">manifest: 104 entries</tspan><tspan x="565" dy="17.5">+26 files merge-wi8-wi17 (Nov 25 00:12Z)</tspan><tspan x="565" dy="17.5">+48 tombstones (all 07189f54,</tspan><tspan x="565" dy="17.5">Nov 25 20:01:05Z, one sync)</tspan></text><rect x="810" y="60" width="300" height="150" rx="10" stroke="#1e1e1e" stroke-width="2" fill="#ebfbee" opacity="1"/><text x="960" y="114" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle"><tspan x="960" dy="0">This computer d34f9008</tspan><tspan x="960" dy="17.5">77 files = last-sync base (77)</tspan><tspan x="960" dy="17.5">no local edits since Nov 24 17:06</tspan><tspan x="960" dy="17.5">last sync saw none of the above</tspan></text><polyline points="320,135 400,135" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linejoin="round" marker-end="url(#head-1e1e1e)"/><rect x="340.6" y="124.25" width="38.800000000000004" height="21.5" fill="#ffffff"/><text x="360" y="140.25" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle"><tspan x="360" dy="0">sync</tspan></text><polyline points="810,135 730,135" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linejoin="round" marker-end="url(#head-1e1e1e)"/><rect x="750.6" y="124.25" width="38.800000000000004" height="21.5" fill="#ffffff"/><text x="770" y="140.25" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle"><tspan x="770" dy="0">plan</tspan></text><rect x="810" y="260" width="300" height="120" rx="10" stroke="#1e1e1e" stroke-width="2" fill="#ffe3e3" opacity="1"/><text x="960" y="299" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle"><tspan x="960" dy="0">Planner reads each tombstone as</tspan><tspan x="960" dy="17.5">'storage changed, local unchanged,</tspan><tspan x="960" dy="17.5">storage has no content' = delete here</tspan><tspan x="960" dy="17.5">48 of 77 &gt; 30% brake: paused</tspan></text><polyline points="960,210 960,260" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linejoin="round" marker-end="url(#head-1e1e1e)"/><rect x="400" y="260" width="330" height="120" rx="10" stroke="#1e1e1e" stroke-width="2" fill="#fff3bf" opacity="1"/><text x="565" y="299" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle"><tspan x="565" dy="0">The 48 = 9 folders (ids 8 to 16):</tspan><tspan x="565" dy="17.5">7 blender-* + flow-domain-module (5 files each)</tspan><tspan x="565" dy="17.5">+ new-work-item-7 (8 files)</tspan><tspan x="565" dy="17.5">all named in merge-wi8-wi17 mergedFolders</tspan></text><polyline points="565,210 565,260" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linejoin="round" marker-end="url(#head-1e1e1e)"/><rect x="20" y="260" width="330" height="120" rx="10" stroke="#1e1e1e" stroke-width="2" fill="#f1f3f5" opacity="1"/><text x="185" y="299" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle"><tspan x="185" dy="0">BI project: same bucket, NO prefix</tspan><tspan x="185" dy="17.5">reads root manifest.json only</tspan><tspan x="185" dy="17.5">var-density/ is just 106 keys under it:</tspan><tspan x="185" dy="17.5">not involved in the 48</tspan></text><rect x="400" y="420" width="710" height="70" rx="10" stroke="#1e1e1e" stroke-width="2" fill="#d3f9d8" opacity="1"/><text x="755" y="451.5" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle"><tspan x="755" dy="0">By hand in the bucket: nothing. Content is in merge-wi8-wi17 (all 12 notes kept, mergedFrom added).</tspan><tspan x="755" dy="17.5">Folder pass (chunk B) reads mergedFolders: the 48 become a merge, not deletes.</tspan></text></svg>
