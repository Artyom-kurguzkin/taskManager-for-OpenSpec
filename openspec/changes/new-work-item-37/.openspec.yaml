es one ui line}, {suite: LoggingUserActionsTests, test: 'A WebView2 failure is described by its kind, reason and exit code'}, {suite: LoggingUserActionsTests, test: A watched WebView2 browser process that ends with a failure code is logged as an Error with its pid and exit code}, {suite: LoggingUserActionsTests, test: 'A page script error reaches the log as one Warning with its message, source, line, column and stack'}, {suite: LoggingUserActionsTests, test: "A component that throws inside the app's error boundary logs one Error with the exception type and the page, and the boundary shows a message with a Reload link"}, {suite: LoggingUserActionsTests, test: Attaching to no window does nothing}, {suite: LoggingUserActionsTests, test: 'A refused command writes a warning, not a ui line'}]
