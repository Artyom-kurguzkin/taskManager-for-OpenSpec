lated list, where × unlinks one; what the description merely mentions has no ×'}, {suite: UsingTheWorklogTests, test: "The description is the last entry of the worklog, at the bottom as the item's first post, has no hover effect, and Shift-click Edit changes it in place"}, {suite: UsingThePagesTests, test: The description shows formatted text in the worklog until you Shift-click it and choose Edit}, {suite: UsingThePagesTests, test: "The note editor fills its tile and the worklog's description editor sits in the feed, both with no border of their own while editing"}, {suite: UsingThePagesTests, test: "Pasting an image into the worklog's description editor inserts a link to the saved file at the caret, and the description entry renders the image"}, {suite: UsingTheWorklogTests, test: 'The worklog filters hide notes, events, links or subtask events, and who narrows the feed to one person'}, {suite: UsingTheBoardTests, test: 'While a worklog is open the side menu shows a Worklog block with its filters and actions first, and the block goes when the worklog closes'}, {suite: UsingTheBoardTests, test: "In split view the Worklog block comes before the list's organise, sort and display blocks"}, {suite: UsingTheBoardTests, test: "The Worklog block lists the feed's days newest first with their entry counts, and clicking a day jumps the feed to it"}, {suite: UsingTheWorklogTests, test: The worklog publishes its days to the side menu and updates them when the filters change}, {suite: UsingTheWorklogTests, test: 'An Unlink menu stays on the entry it was opened on when the feed changes under it: a new entry above does not move the menu to another test, and Unlink removes the test that was clicked'}, {suite: KeepingNotesTests, test: 'Editing a note line that already made a subtask retexts that subtask instead of creating another, and the line keeps one marker at its end'}, {suite: KeepingNotesTests, test: 'A line with the marker anywhere is never promoted again, and no subtask text ever contains the marker'}, {suite: UsingTheWorklogTests, test: "A note's menu offers Make it a decision and Make it a subtask, and a decision's offers Make it a note and Make it a subtask, under Edit"}, {suite: UsingTheWorklogTests, test: A subtask that is ticked has no convert menu in the feed}, {suite: UsingTheWorklogTests, test: 'Making a note a subtask adds the subtask from its title, removes the note and logs the conversion'}, {suite: UsingTheWorklogTests, test: 'Making a subtask a decision creates the decision from its text, removes the subtask and logs the conversion'}, {suite: EditingWorkItemsTests, test: 'Removing a subtask drops its line, renumbers the rest of its group and records subtask-removed with its text'}, {suite: EditingWorkItemsTests, test: Removing a subtask that is not there is refused and writes nothing}, {suite: KeepingNotesTests, test: 'Deleting a note removes its file and the attachment files copied for it, and refuses a note that is gone'}, {suite: KeepingNotesTests, test: Converting a note to a decision and back changes only its kind and records a converted event each time}, {suite: KeepingNotesTests, test: 'Converting a note to a subtask uses its title, or the first line of its text when the title is the default, then deletes the note'}, {suite: KeepingNotesTests, test: "Converting a subtask to a note or a decision creates it from the subtask's text, dated now and by the given person, and removes the subtask"}, {suite: UsingThePagesTests, test: "Dependencies are listed in the rail's Waiting on list: a done one struck through, and × removes it"}, {suite: UsingThePagesTests, test: In a narrow window the linked tasks rail drops below the main list and nothing is minimised}, {suite: UsingThePagesTests, test: "The linked tasks view lists what is attached to the item in the rail's Related list: the plan, documents and attachments of its notes, and images, each once"}, {suite: UsingThePagesTests, test: 'The linked tasks view shows the subta