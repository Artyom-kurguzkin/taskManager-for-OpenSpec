  tests: [{suite: ArrangingTheBoardTests, test: 'An item counts as changed in a period when an event, a note, its creation or a file write falls in it'}, {suite: ArrangingTheBoardTests, test: 'With a changed period set, items outside it are hidden on board, list and roadmap and items inside stay; without it nothing changes'}, {suite: UsingTheBoardTests, test: "The side menu's changed picker sets the period, the legend names it and counts what is shown, and Show all in the picker clears it; the choice is remembered per board"}, {suite: UsingTheBoardTests, test: 'A changed period that covers nearly every item still shows the picker working: the legend counts how many items are shown of those the other filters leave'}, {suite: UsingThePagesTests, test: The date range picker offers its clear button only when a ClearLabel is given and a range is set; without a ClearLabel it keeps the plain Clear}, {suite: SwitchingProjectsTests, test: "Opening the list with two projects open still groups by project when the saved list settings were made with one project, so the page stays alive and the side menu's pickers keep working"}, {suite: KeepingNotesTests, test: "A note's title lives in its frontmatter: setting it leaves the body and its first heading alone, and a note without a title reads it from its first heading"}, {suite: UsingThePagesTests, test: 'The note page edits in place: the title is an input, clicking the note opens the editor, focusing out saves and shows the rendered note; a pasted image becomes an attachment'}, {suite: EditingWorkItemsTests, test: 'A new work item starts its event log with created, and a merged item keeps the events of the items it was made from'}, {suite: EditingWorkItemsTests, test: An events.log line that cannot be read is skipped and kept in the file when the next event is appended}, {suite: EditingWorkItemsTests, test: "Changing an item's status is recorded as an event with the old and the new status, who did it and when"}, {suite: EditingWorkItemsTests, test: Linked documents are stored as repo-relative paths in x-rtm.docs; a path outside the repository is refused}, {suite: EditingWorkItemsTests, test: 'Linking and unlinking a commit, a test or a document records one event each, and nothing when the list did not change'}, {suite: EditingWorkItemsTests, test: 'Ticking, reopening and adding a subtask and adding or removing a dependency are recorded as events'}, {suite: EditingWorkItemsTests, test: "Without a configured actor an event is recorded as someone's, and a failing event write never fails the command"}, {suite: GuidingAgentsTests, test: 'The agent guide tells agents to keep the worklog current, with the tools and by hand in events.log'}, {suite: KeepingNotesTests, test: 'A note can be created with a date of its own, which is its created time'}, {suite: SwitchingProjectsTests, test: What the user changes in the app is recorded in the worklog under their name}, {suite: UsingTheBoardOverMcpTests, test: 'board_get returns the worklog, notes and events together, newest first, the newest twenty in concise format'}, {suite: UsingTheBoardOverMcpTests, test: 'board_update links documents, and board_note writes an entry whose title is its first line when none is given'}, {suite: UsingTheBoardOverMcpTests, test: What an agent changes through the tools is recorded in the item's worklog under the agent's name}, {suite: UsingThePagesTests, test: Add note in the worklog's date menu creates a note and opens it in an editor in the feed}, {suite: UsingThePagesTests, test: 'Dependencies are listed in the Waiting on column: a done one struck through, and × removes it'}, {suite: UsingThePagesTests, test: In a narrow window the four linked-tasks columns stack and nothing is minimised}, {suite: UsingThePagesTests, test: 'Opening a work item shows its header and description, its subtasks under Linked tasks, and its notes in the Worklog'}, {suite: UsingThePagesTests, test: 'Subtasks are ticked, edited, added and selected in the linked tasks view as they were in the subtasks tile'}, {suite: UsingThePagesTests, test: 'The linked tasks view lists what is attached to the item in a Related column: the plan, documents and attachments of its notes, and images, each once'}, {suite: UsingThePagesTests, test: "The item page opens on the worklog, with Worklog and Linked tasks to switch between, the current one marked, and the description is the worklog's last entry"}, {suite: UsingThePagesTests, test: 'The linked tasks view shows subtasks, what the item waits on, what waits on it and what is related to it in four columns'}, {suite: UsingThePagesTests, test: The subtasks column lists every subtask and counts how many are done}, {suite: UsingThePagesTests, test: The Subtasks column shows each task group as a collapsible header with its progress}, {suite: UsingThePagesTests, test: The Waiting on column has a picker of existing work items to wait on; choosing one makes it a dependency}, {suite: UsingThePagesTests, test: 'The worklog lists the newest day and note first, with its time and author'}, {suite: UsingThePagesTests, test: The worklog view shows the item's notes in the feed and tells the page when one is added}, {suite: UsingTheWorklogTests, test: A linked test shows its latest result in the feed}, {suite: UsingTheWorklogTests, test: A status change and a ticked subtask appear in the feed as events}, {suite: UsingTheWorklogTests, test: 'Add note opens an editor in the feed; leaving it saves the title and the text, and a note added under an older day is dated that day'}, {suite: UsingTheWorklogTests, test: "An agent's note carries the agent chip until it is reviewed, and a note merged in says which item it came from"}, {suite: UsingTheWorklogTests, test: Clicking a day folds it and clicking it again unfolds it}, {suite: UsingTheWorklogTests, test: 'Linking a commit, a test or a document from the menu shows it in the feed as an event with who did it'}, {suite: UsingTheWorklogTests, test: 'Links made before the log existed still show: commits at their commit time, tests and documents under Linked earlier'}, {suite: UsingTheWorklogTests, test: 'Shift-clicking a day opens a menu to add a note, link a document, link a test, link a commit or add a subtask'}, {suite: UsingTheWorklogTests, test: 'Shift-clicking a linked commit, test or document offers Unlink, and the feed then says it was unlinked'}, {suite: UsingTheWorklogTests, test: 'Shift-clicking a note offers Edit, which opens it in place'}, {suite: UsingTheWorklogTests, test: 'The worklog groups notes and events by day, newest day first, each entry with the time it was created, and today is always there'}, {suite: UsingTheWorklogTests, test: "Without git Link commit is switched off and says why, and a merged item's feed shows the commits that mention the items it was made from"}, {suite: UsingThePagesTests, test: "A work item's plan lives in the Related list, not in the header: picked there from the plans folder, it opens rendered in the app and its × unlinks it"}, {suite: UsingThePagesTests, test: 'Linked documents show in the Related list, where × unlinks one; what the description merely mentions has no ×'}, {suite: UsingThePagesTests, test: "The item page's views have no frames: the description, the Related list, the linked-tasks columns and rows, and the worklog's notes sit straight on the page"}, {suite: UsingTheWorklogTests, test: "The description is the last entry of the worklog, at the bottom as the item's first post, has no hover effect, and Shift-click Edit changes it in place"}, {suite: UsingThePagesTests, test: The description shows formatted text in the worklog until you Shift-click it and choose Edit}, {suite: UsingThePagesTests, test: "The note editor fills its tile and the worklog's description editor sits in the feed, both with no border of their own while editing"}, {suite: UsingThePagesTests, test: "Pasting an image into the worklog's description editor inserts a link to the saved file at the caret, and the description entry renders the image"}, {suite: UsingTheWorklogTests, test: 'The worklog filters hide notes, events, links or subtask events, and who narrows the feed to one person'}, {suite: UsingTheBoardTests, test: 'While a worklog is open the side menu shows a Worklog block with its filters and actions first, and the block goes when the worklog closes'}, {suite: UsingTheBoardTests, test: "In split view the Worklog block comes before the list's organise, sort and display blocks"}, {suite: UsingTheBoardTests, test: "The Worklog block lists the feed's days newest first with their entry counts, and clicking a day jumps the feed to it"}, {suite: UsingTheWorklogTests, test: The worklog publishes its days to the side menu and updates them when the filters change}, {suite: UsingTheWorklogTests, test: 'An Unlink menu stays on the entry it was opened on when the feed changes under it: a new entry above does not move the menu to another test, and Unlink removes the test that was clicked'}]
