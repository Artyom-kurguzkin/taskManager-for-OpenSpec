rent process ends}, {suite: ServingTheBoardTests, test: 'With no server running the stdio shim answers a tool call with an error asking to open the app, and relays once a server is up'}, {suite: ServingTheBoardTests, test: 'With no server running the stdio shim still answers initialize and tools/list itself, so the client connects'}, {suite: ServingTheBoardTests, test: The app's server start passes its own pid as --parent and turns the idle exit off}]
