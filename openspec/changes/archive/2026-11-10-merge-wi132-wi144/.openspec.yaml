le on a band coloured by status, its feature and its #wi tag'}, {suite: ArrangingTheBoardTests, test: 'Hidden columns report how many items they hold, following the contributor filter and the work items / subtasks switch'}, {suite: UsingTheBoardTests, test: 'List rows drag like cards: by their grip, in front of another row to reorder, onto a group to change status'}, {suite: UsingTheBoardTests, test: "In the list, arrow keys move the selected rows, and Ctrl+C copies the selected cells (the script's part)"}, {suite: UsingTheBoardTests, test: 'In the list, Shift-click on a row selects it and a plain click on its title opens it, as on the board'}, {suite: UsingTheBoardTests, test: 'A grid column is hidden from the × in its header and listed under Hidden in the side menu, where the eye brings it back'}, {suite: UsingTheBoardTests, test: "Completed rows have editable label and priority but status stays read-only, and Completed has no '+ Add item'"}, {suite: UsingTheBoardTests, test: 'An expanded list row numbers its subtasks 1.1, 1.2 …, and only that row unfolds'}, {suite: UsingTheBoardTests, test: A hidden work item's row is marked as hidden in the list}, {suite: UsingTheBoardTests, test: "In the list, a group's chevron collapses it and expands it again, and it stays collapsed after the data reloads"}, {suite: UsingTheBoardTests, test: "In the list, a project's chevron collapses all of its rows, like on the board, and a group collapsed inside a project stays so, in that project only"}, {suite: UsingTheBoardTests, test: "In the list, subtasks start folded away; the rail's subtasks button, selected, shows every row's subtasks, and unselected folds them again"}, {suite: UsingThePagesTests, test: Saving anything on the work item page shows a Saved toast}, {suite: UsingThePagesTests, test: "A note's own autosave doesn't reload the page under your cursor, and says Saved once it is on disk"}, {suite: UsingThePagesTests, test: 'On the work item page the agent is a contributor c