ills, and a status group's name wears its band"}, {suite: UsingTheBoardTests, test: 'A card shows its title on a band coloured by status, its feature, its date and people, its subtask count, its coloured label tag and its #wi tag, and no priority tag'}, {suite: UsingTheBoardTests, test: 'List cells keep their content inside the column: long text is cut with an ellipsis and shows in full as a tooltip'}, {suite: UsingTheBoardTests, test: A card without subtasks or a label shows no count and no label tag}, {suite: ArrangingTheBoardTests, test: 'Within a column cards fall into priority lanes, highest first, one lane per priority present'}, {suite: UsingTheBoardTests, test: 'A column shows priority subgroups when its cards differ in priority, and dropping a card on a subgroup sets its priority'}, {suite: SwitchingProjectsTests, test: 'Remove a project…, the last entry of the repository menu and the only way to remove one (no close button on each project), asks which project to remove and closes that tab (files stay)'}, {suite: UsingThePagesTests, test: Keyboard hints (F) are off until switched on in Settings; the switch is pushed to the page script}, {suite: RememberingSettingsTests, test: Settings saved now are there the next time the app starts}, {suite: ArrangingTheBoardTests, test: 'Grouping by feature gives one flat row of feature columns, with no supergroups'}, {suite: UsingTheBoardTests, test: 'Feature grouping shows every feature as a column in one row, with no supergroup headings'}, {suite: UsingTheBoardTests, test: 'Grouped by feature, + feature at the end of the row adds a feature and its column appears'}, {suite: UsingTheBoardTests, test: 'A feature with a spec folder can be deleted too: the dialog says its folder goes, and the column leaves the board'}, {suite: BrowsingFeaturesTests, test: A feature backed by a spec folder is deleted with that folder}, {suite: EditingWorkItemsTests, test: "A feature an open change still has a spec for can't be deleted, and t