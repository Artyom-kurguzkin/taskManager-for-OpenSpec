oardTests, test: "Without a project's list the status columns are the built-in ones and any other status an item has, and an unknown status sorts after the built-in ones"}, {suite: RememberingSettingsTests, test: "A board's merged status columns are saved with the board, per repository, and come back"}, {suite: UsingTheBoardOverMcpTests, test: "The MCP tools use the project's statuses: board_update names them when it refuses one, and board_create and board_update accept one the project added"}, {suite: UsingTheBoardTests, test: "The board and the list use the project's statuses: its columns in its order, and the work item in the status it has"}, {suite: UsingTheBoardTests, test: "Shift-selecting two status columns and choosing Merge shows one column with both statuses' items, saved per board, and Unmerge splits it again"}, {suite: UsingTheBoardTests, test: 'A column that looks like a fixed status offers "Merge with" it in its menu, and one click merges them'}, {suite: UsingTheBoardTests, test: 'Dropping a card into a merged column uses the status its project has, and asks which when it has more than one'}]
